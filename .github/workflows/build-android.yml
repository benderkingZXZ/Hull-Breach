name: Build Android APK

# Автосборка APK при каждом push в main/master и по кнопке «Run workflow».
# Два режима (определяются автоматически):
#   1) ZIP-режим: в корне репозитория лежит файл HullBreach_Game.zip -> проект распаковывается в ./project
#      (удобно, когда сайт GitHub не принимает загрузку многих файлов и папок);
#   2) обычный режим: проект Unity (Assets, Packages, ProjectSettings) лежит в корне репозитория.
# Готовый APK: вкладка Releases (прямая ссылка) и Actions -> Artifacts.
# Нужны секреты UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (см. README.md).

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      include_armv7:
        description: "Добавить 32-битную версию ARMv7 (APK больше, сборка дольше)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check Unity secrets
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret is missing::GitHub secret $name is not set. Settings -> Secrets and variables -> Actions. After adding secrets use Re-run all jobs. See README.md."
              missing=1
            fi
          done
          exit $missing

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Unity project (unpack zip if present)
        run: |
          set -e
          if [ -f HullBreach_Game.zip ]; then
            echo "ZIP mode: unpacking HullBreach_Game.zip into ./project"
            rm -rf _unzip project
            mkdir _unzip project
            unzip -q HullBreach_Game.zip -d _unzip
            found=$(find _unzip -maxdepth 3 -type d -name Assets | head -n 1)
            if [ -z "$found" ]; then
              echo "::error title=Bad zip::Folder Assets was not found inside HullBreach_Game.zip"
              exit 1
            fi
            cp -a "$(dirname "$found")"/. project/
            rm -rf _unzip
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            echo "PROJECT_PREFIX=project/" >> "$GITHUB_ENV"
          else
            echo "Repo mode: Unity project is expected in the repository root"
            if [ ! -d Assets ]; then
              echo "::error title=Project not found::Upload HullBreach_Game.zip to the repository root (or put the Unity project there)."
              exit 1
            fi
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "PROJECT_PREFIX=" >> "$GITHUB_ENV"
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PREFIX }}Library
          key: "Library-Android-${{ hashFiles(format('{0}Packages/manifest.json', env.PROJECT_PREFIX), format('{0}ProjectSettings/ProjectVersion.txt', env.PROJECT_PREFIX)) }}"
          restore-keys: |
            Library-Android-

      # Шаг 1: отдельный запуск Unity, который импортирует TextMeshPro Essentials (без них не работает текст)
      - name: Prepare project (TextMeshPro)
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          targetPlatform: Android
          unityVersion: auto
          versioning: None
          allowDirtyBuild: true
          buildMethod: HullBreach.GameEditor.CiPrepare.Run

      # Шаг 2: создание сцены, настройки Android и сборка APK -> build/Android/HullBreach.apk
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          targetPlatform: Android
          unityVersion: auto
          versioning: None
          allowDirtyBuild: true
          buildMethod: HullBreach.GameEditor.CiBuild.BuildAndroid
          customParameters: -hbVersion 1.0.${{ github.run_number }} -hbVersionCode ${{ github.run_number }} ${{ inputs.include_armv7 && '-includeArmv7' || '' }}

      - name: Check APK
        run: |
          ls -la "${PROJECT_PREFIX}build/Android" || true
          test -f "${PROJECT_PREFIX}build/Android/HullBreach.apk"
          echo "APK size: $(du -h "${PROJECT_PREFIX}build/Android/HullBreach.apk" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HullBreach-apk-${{ github.run_number }}
          path: ${{ env.PROJECT_PREFIX }}build/Android/HullBreach.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Hull Breach APK #${{ github.run_number }}
          prerelease: true
          files: ${{ env.PROJECT_PREFIX }}build/Android/HullBreach.apk
          body: |
            Автосборка #${{ github.run_number }} из коммита ${{ github.sha }}.
            Скачайте HullBreach.apk, разрешите установку из неизвестных источников и установите на Android 7.0+.
